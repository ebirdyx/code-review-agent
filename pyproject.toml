[project]
name = "code-review-agent"
version = "0.1.0"
description = "Prototype AI agent that reviews code changes against Jira requirements."
requires-python = ">=3.12,<3.14"
dependencies = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.1",
    "pydantic>=2.13.5",
    "ruff>=0.17.0",
]

[project.scripts]
review-agent = "code_review_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
