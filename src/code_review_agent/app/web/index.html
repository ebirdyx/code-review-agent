<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Review Agent</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><h1>Code Review Agent</h1><span id="cfg" class="muted"></span></div>
    <form id="new-review" autocomplete="off">
      <label for="pr" class="flabel">Pull request</label>
      <div class="fgroup">
        <input id="pr" placeholder="owner/repo#12 or paste the PR link" size="40" required>
        <button id="start" type="submit">Review this PR</button>
      </div>
      <span></span>
      <div class="fgroup">
        <label class="check"><input type="checkbox" id="jira"> Also read its Jira ticket</label>
        <span id="jira-opts" hidden>
          <input id="projects" placeholder="Prefix, e.g. KAN" size="14" aria-label="Jira ticket prefix"
                 title="Optional. Finds keys like KAN-4 anywhere in the PR title or text. Not needed if the description says 'Jira: KAN-4'.">
          <span class="muted">optional: finds KAN-4 in the PR text</span>
        </span>
      </div>
    </form>
    <button id="theme" type="button" title="Switch between dark and light"></button>
  </header>
  <main>
    <aside>
      <div class="aside-head"><h2>Runs</h2><button id="show-overview" type="button">Overview</button></div>
      <input id="filter" type="search" placeholder="Filter: case, model, status, evaluation..." autocomplete="off">
      <ul id="runs"></ul>
    </aside>
    <section id="view"></section>
  </main>
</body>
</html>
